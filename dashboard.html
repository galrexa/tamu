<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – Buku Tamu Bappisus</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body class="page-dashboard">

<div class="page-wrapper">
    <div class="dashboard-section">

        <div class="dash-topbar">
            <div class="dash-info">
                <div class="dash-title">Buku Tamu Harian</div>
                <div class="dash-meta">
                    <span class="dash-date" id="liveDate">—</span>
                    <span class="dash-sep">·</span>
                    <span class="dash-clock" id="liveClock">—</span>
                </div>
                <div class="dash-sub" id="lastUpdate"></div>
            </div>
            <div class="dash-actions">
                <span class="user-chip" id="userChip" style="display:none">
                    <span class="avatar" id="userAvatar">?</span>
                    <span class="uname" id="userName">—</span>
                </span>
                <span class="live-badge" id="liveBadge" style="display:none">
                    <span class="live-dot"></span> Live
                </span>
                <div class="export-wrap" id="exportWrap">
                    <button class="btn-outline btn-export" id="exportBtn">Ekspor ▾</button>
                    <div class="export-dropdown" id="exportDropdown" style="display:none">
                        <button class="export-item" id="exportCsvBtn">Unduh CSV</button>
                        <button class="export-item" id="exportXlsxBtn">Unduh Excel (.xlsx)</button>
                    </div>
                </div>
                <button class="btn-outline" id="logoutBtn">Keluar</button>
                <button class="btn-sm-navy" id="refreshBtn">Perbarui Data</button>
            </div>
        </div>

        <!-- Stat summary -->
        <div class="stat-row">
            <div class="stat-card">
                <div class="stat-label" id="statTotalLabel">Total Tamu Hari Ini</div>
                <div class="stat-value" id="statTotal">—</div>
                <div class="stat-accent"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Instansi Unik</div>
                <div class="stat-value" id="statInstansi">—</div>
                <div class="stat-accent"></div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <div class="table-header">
                <h2>Daftar Kunjungan</h2>
                <div class="filter-group">
                    <label class="filter-label" for="dateFilter">Tanggal:</label>
                    <input type="date" class="search-input date-input" id="dateFilter">
                    <button type="button" class="btn-outline btn-today" id="todayBtn">Hari Ini</button>
                    <input type="text" class="search-input" id="searchInput"
                           placeholder="Cari nama atau instansi...">
                </div>
            </div>
            <div class="tbl-container">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Nama Tamu</th>
                            <th>Instansi</th>
                            <th>Pejabat Tujuan</th>
                            <th>Kontak</th>
                        </tr>
                    </thead>
                    <tbody id="tamuBody">
                        <tr><td colspan="5" class="empty-state">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="assets/js/dashboard.js?v=4"></script>
</body>
</html>
